name: release

# Pushing a v* tag publishes a release: GitHub Release + attestations,
# Homebrew cask (stable tags only) and npm packages. Tags are protected by a
# ruleset; only maintainers can push them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    # The environment holds TAP_GITHUB_TOKEN and is restricted to v* tags.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/metadata.json
            dist/artifacts.json
            dist/deslop-hook_*/deslop-hook*
          retention-days: 7

  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node scripts/npm-publish.mjs dist
        env:
          # Only for the very first publish, before trusted publishing can be
          # configured on npmjs.com (it needs the packages to exist). Delete
          # the NPM_TOKEN secret afterwards; OIDC takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
