name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: nothing here writes anywhere. This is a public repository,
# so every job runs on GitHub-hosted runners, never on self-hosted ones.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: git --version
      - run: go vet ./...
      - name: go test
        shell: bash
        # The race detector needs cgo, which the Windows runner lacks by default.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  minimum-go:
    # go.mod promises Go 1.23; `go install` and pre-commit's `language: golang`
    # build with whatever toolchain the user has.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - run: GOTOOLCHAIN=local go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: fuzz the scrubber
        run: go test -run=NONE -fuzz=FuzzScrub -fuzztime=60s ./internal/scrub
      - name: dogfood
        # The repository itself must be free of what it removes.
        run: go run ./cmd/deslop-hook check --all

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          TAP_GITHUB_TOKEN: unused-in-snapshots
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: npm packages
        run: node scripts/npm-publish.mjs --dry-run dist
      - name: install.sh syntax
        run: sh -n scripts/install.sh
